<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mod4-Lab1</title>
    <script defer src="index.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>Task One</h1>
    <input id="firstName" type="text" placeholder="Enter Your First Name" />
    <input id="lastName" type="text" placeholder="Enter Your Last Name" />
    <button id="submitButton">Submit</button>

    <h1>Task Two</h1>
    <label>Price:</label>
    <input type="text" id="price"><br><br>
    <label>Quantity:</label>
    <input type="text" id="quantity"><br><br>
    <label>Tax Rate:</label>
    <input type="text" id="taxRate"><br><br>

    <button id="calculateBtn">Calculate Total</button>

    <p id="answer"></p>

    <h1>Task Three</h1>
    <label>Age:</label>
    <input type="text" id="age"><br><br>
    <label>Employed? (true or false):</label>
    <input type="text" id="isEmployed"><br><br>

    <button id="checkBtn">Check Eligibility</button>

    <p id="result"></p>

    <h1>Task Four</h1>
    <label>Price:</label>
    <input type="text" id="prices"><br><br>
    <label>Quantity:</label>
    <input type="text" id="quantities"><br><br>
    <label>Tax Rate:</label>
    <input type="text" id="taxRates"><br><br>
    <label>Discount (optional):</label>
    <input type="text" id="discount"><br><br>

    <button id="calculatesBtn">Calculate Total</button>

    <p id="results"></p>

</body>

</html>
